zooms:
  - network: zoom0-layer3
    supports: layer3
    nodes:
      site-b-cr:          {supports: [site-b-cr-1, site-b-cr-2]}
      site-b-fw:          {supports: [site-b-fw-1, site-b-fw-2]}
      site-b-wan-zone-rt: {supports: [site-b-br-1, site-b-br-2]}
      site-a-wan-zone-rt: {supports: [site-a-br-1, site-a-br-2]}
      site-a-fw:          {supports: [site-a-fw-1, site-a-fw-2]}
      site-a-cr:          {supports: [site-a-cr-1, site-a-cr-2]}
    links:
      - endpoints: ['site-b-cr:eth1', 'site-b-fw:eth2']
      - endpoints: ['site-b-fw:eth1', 'site-b-wan-zone-rt:eth2']
      - endpoints: ['site-b-wan-zone-rt:eth1', 'site-a-wan-zone-rt:eth1']
      - endpoints: ['site-a-wan-zone-rt:eth2', 'site-a-fw:eth1']
      - endpoints: ['site-a-fw:eth2', 'site-a-cr:eth1']

  - network: zoom1-layer3
    supports: zoom0-layer3
    nodes:
      site-b-cr:   {supports: [site-b-cr]}
      site-b-fw:   {supports: [site-b-fw]}
      wan-zone-rt: {supports: [site-a-wan-zone-rt, site-b-wan-zone-rt]}
      site-a-fw:   {supports: [site-a-fw]}
      site-a-cr:   {supports: [site-a-cr]}
    links:
      - endpoints: ['site-b-cr:eth1', 'site-b-fw:eth2']
      - endpoints: ['site-b-fw:eth1', 'wan-zone-rt:eth2']
      - endpoints: ['wan-zone-rt:eth1', 'site-a-fw:eth1']
      - endpoints: ['site-a-fw:eth2', 'site-a-cr:eth1']
