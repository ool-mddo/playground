server {
    listen 80;
    client_max_body_size 100M;
    send_timeout 14400;
    proxy_send_timeout 14400;
    proxy_read_timeout 14400;

    location /batfish/ {
        proxy_pass http://batfish-wrapper:5000;
    }
    location /configs/ {
        proxy_pass http://batfish-wrapper:5000;
    }
    location /queries/ {
        proxy_pass http://batfish-wrapper:5000;
    }
    # data for netoviz2 can be large (compressed only here; the other APIs are not changed)
    location ~ ^/topologies/[^/]+/[^/]+/netoviz2/ {
        gzip on;
        gzip_min_length 1024;
        gzip_types application/json;
        proxy_pass http://netomox-exp:9292;
    }
    location /topologies/ {
        proxy_pass http://netomox-exp:9292;
    }
    location /conduct/ {
        proxy_pass http://model-conductor:9292;
    }
    location /usecases/ {
        proxy_pass http://netomox-exp:9292;
    }
    # (nginx redirects /netoviz2 to /netoviz2/ by itself; make the redirect relative to keep the port of the client)
    location = /netoviz2 {
        absolute_redirect off;
        return 301 /netoviz2/;
    }
    location /netoviz2/ {
        proxy_pass http://netoviz2:80;
    }
    location /bgp_policy/ {
        proxy_pass http://bgp-policy-parser:5000;
    }
    location /fw_policy/ {
        proxy_pass http://firewall-policy-parser:5000;
    }
    # location /state-conductor/ {
    #     proxy_pass http://state-conductor:5000;
    # }
    location / {
        proxy_pass http://fish-tracer:3000;
    }
}
